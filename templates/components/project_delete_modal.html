<button type="button" class="btn btn-danger btn-sm"
        popovertarget="delete-project-{{ project.id }}"
        aria-label="Hapus {{ project.title }}">Hapus</button>

<div id="delete-project-{{ project.id }}" class="delete-modal" popover="auto"
     role="dialog" aria-modal="true"
     aria-labelledby="delete-project-title-{{ project.id }}">
    <button type="button" class="delete-modal-backdrop"
            popovertarget="delete-project-{{ project.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>

    <div class="card delete-modal-box">
        <h2 id="delete-project-title-{{ project.id }}">Hapus proyek ini?</h2>
        <p class="card-text">
            <strong>{{ project.title }}</strong> akan hilang dari daftar dan tidak
            bisa dikembalikan.
        </p>

        <form method="post" action="{% url 'main:delete_project' project.id %}"
              class="delete-modal-form">
            {% csrf_token %}
            <label for="delete-password-{{ project.id }}">Kode Akses</label>
            <input type="password" name="password" id="delete-password-{{ project.id }}"
                   placeholder="Kode akses pemilik" required>

            <div class="delete-modal-actions">
                <button type="button" class="btn btn-external btn-sm"
                        popovertarget="delete-project-{{ project.id }}"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="btn btn-danger btn-sm">Ya, hapus</button>
            </div>
        </form>
    </div>
</div>
